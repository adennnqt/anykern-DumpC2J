name: DumpC2J Kernel Builder (Matrix)

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Custom Kernel Name (LOCALVERSION)"
        required: true
        type: string
        default: "-DumpC2J"
      clang_variant:
        description: "Clang Toolchain (shared across all builds)"
        required: true
        type: choice
        options:
          - neutron
          - cirrus
          - weebx
          - zyc
          - aosp
        default: neutron
      hz:
        description: "Refresh Rate (HZ) (shared across all builds)"
        required: true
        type: choice
        options:
          - powersave
          - balance
          - smooth
          - performance
          - ultra-performance
        default: smooth
      combo_stock:
        description: "Vanilla (No Root)"
        required: true
        type: boolean
        default: true
      combo_susfs_sukisu:
        description: "SUSFS - SukiSU"
        required: true
        type: boolean
        default: true
      combo_susfs_resukisu:
        description: "SUSFS - ReSukiSU"
        required: true
        type: boolean
        default: true
      combo_susfs_ksunext:
        description: "SUSFS - KSU-Next"
        required: true
        type: boolean
        default: true
      lto:
        description: "LTO Mode (shared across all builds)"
        required: true
        type: choice
        options:
          - full
          - thin
          - none
        default: full
      bypasscharging:
        description: "Bypass Charging (MCA Override)"
        required: true
        type: boolean
        default: true
      droidspaces:
        description: "Droidspaces Support"
        required: true
        type: boolean
        default: false
      kernel_version_spoof:
        description: "Spoof Kernel Version (leave blank to use upstream)"
        required: false
        type: string
        default: ""
      debug:
        description: "Debug Mode (nokaslr, no optimizations)"
        required: true
        type: boolean
        default: false
      nomount:
        description: "NoMount (VFS Path Injection, no mount table)"
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate_matrix:
    name: "Generate Build Matrix"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Build matrix from checked combos
        id: gen
        env:
          COMBO_STOCK: ${{ inputs.combo_stock }}
          COMBO_SUSFS_SUKISU: ${{ inputs.combo_susfs_sukisu }}
          COMBO_SUSFS_RESUKISU: ${{ inputs.combo_susfs_resukisu }}
          COMBO_SUSFS_KSUNEXT: ${{ inputs.combo_susfs_ksunext }}
        run: |
          python3 -c "
          import json, os

          combos = [
              ('COMBO_STOCK', 'stock', 'none'),
              ('COMBO_SUSFS_SUKISU', 'susfs', 'sukisu'),
              ('COMBO_SUSFS_RESUKISU', 'susfs', 'resukisu'),
              ('COMBO_SUSFS_KSUNEXT', 'susfs', 'ksu-next'),
          ]

          out = []
          for env_key, variant, root in combos:
              if os.environ.get(env_key) == 'true':
                  out.append({'variant': variant, 'root': root})

          if not out:
              raise SystemExit('No combo was checked — check at least one.')

          print('matrix=' + json.dumps(out))
          " >> "$GITHUB_OUTPUT"

      - name: Show generated matrix
        run: echo '${{ steps.gen.outputs.matrix }}'

  build:
    name: "Build"
    needs: generate_matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 0

      - name: Build Kernel (shared pipeline)
        uses: ./builder/.github/actions/build-kernel
        with:
          variant: ${{ matrix.variant }}
          root: ${{ matrix.root }}
          hz: ${{ inputs.hz }}
          clang_variant: ${{ inputs.clang_variant }}
          lto: ${{ inputs.lto }}
          kernel_name: ${{ inputs.kernel_name }}
          bypasscharging: ${{ inputs.bypasscharging }}
          droidspaces: ${{ inputs.droidspaces }}
          debug: ${{ inputs.debug }}
          nomount: ${{ inputs.nomount }}
          kernel_version_spoof: ${{ inputs.kernel_version_spoof }}
          kernel_clone_token: ${{ secrets.KERNEL_CLONE_TOKEN }}

      - name: Save ccache (local part)
        if: always()
        continue-on-error: true
        run: bash builder/scripts/ccache_save.sh

      - name: Upload ccache part
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ccache-part-${{ matrix.variant }}-${{ matrix.root }}
          path: ${{ env.CCACHE_TAR_PATH }}
          retention-days: 1

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash builder/scripts/notify_telegram.sh

  merge_ccache:
    name: "Merge & Publish ccache"
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Merge & publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          CCACHE_ASSET="ccache-${{ inputs.clang_variant }}-lto-${{ inputs.lto }}.tar.zst"
          bash builder/scripts/merge_ccache.sh "$CCACHE_ASSET"